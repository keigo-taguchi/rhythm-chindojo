<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="豆腐斬り・おじぎ・ハト・忍者屋敷・くしゃみ大臣など、全20ステージのちょっとヘンなリズムゲーム。">
<title>リズム珍道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: 携帯ゲーム機のような濃い茶色の筐体に 16:9 の画面を1枚。メニューは画面の上に重ねる */
:root{
  --case:#2b1d14; --case2:#3d2a1d; --paper:#fff6e0; --ink:#2b1d14;
  --sun:#ffcf3f; --tomato:#ef5a3c; --sky:#5ec2e8; --leaf:#5aa95a; --muted:#c9b79c;
  --fd:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --fb:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--case);color:var(--paper);font-family:var(--fb);margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;gap:12px}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000;
  box-shadow:0 0 0 6px var(--case2),0 0 0 9px #120b07,0 18px 40px rgba(0,0,0,.5);container-type:inline-size;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;padding:2.5cqw;text-align:center;color:var(--ink);overflow:auto}
.ov.dim{background:rgba(43,29,20,.6);color:var(--paper)}
h1{font-family:var(--fd);font-weight:400;font-size:9cqw;line-height:1;margin:0;color:var(--paper);
  text-shadow:.5cqw .5cqw 0 var(--tomato),-.25cqw -.25cqw 0 var(--ink),.25cqw -.25cqw 0 var(--ink),-.25cqw .25cqw 0 var(--ink),.25cqw .25cqw 0 var(--ink);letter-spacing:.04em;text-wrap:balance}
.sub{font-size:max(11px,2.3cqw);font-weight:800;background:var(--ink);color:var(--sun);padding:.6cqw 1.6cqw;border-radius:99px}
.row{display:flex;gap:1.6cqw;flex-wrap:wrap;justify-content:center}
button{font-family:var(--fd);font-weight:400;font-size:max(12px,2.3cqw);border:max(2px,.35cqw) solid var(--ink);background:var(--sun);color:var(--ink);
  padding:1cqw 2.6cqw;border-radius:99px;cursor:pointer;box-shadow:0 .5cqw 0 var(--ink);transition:transform .08s}
button:hover{transform:translateY(-.2cqw)}
button:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--ink)}
button:focus-visible{outline:.4cqw solid var(--sky);outline-offset:.3cqw}
button.ghost{background:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw;width:96%}
.card{font-family:var(--fb);font-weight:800;text-align:left;display:flex;flex-direction:column;gap:.4cqw;padding:1.1cqw 1.2cqw;border-radius:1.4cqw;font-size:max(10px,1.4cqw);line-height:1.3;position:relative;min-width:0}
.card b{font-family:var(--fd);font-weight:400;font-size:max(12px,2.1cqw);line-height:1.15}
.card small{font-weight:500;font-size:max(9px,1.2cqw);opacity:.85}
.card .no{font-family:var(--fd);font-size:max(8px,1.1cqw);opacity:.6;letter-spacing:.08em}
.medal{align-self:flex-start;font-family:var(--fd);font-size:max(8px,1.1cqw);padding:.15cqw .7cqw;border-radius:99px;background:var(--ink);color:var(--paper)}
.medal.hi{background:var(--tomato)}
.medal.none{background:transparent;color:inherit;opacity:.5;border:1px dashed currentColor}
.panel{background:var(--paper);color:var(--ink);border:.4cqw solid var(--ink);border-radius:2cqw;padding:2cqw 3cqw;max-width:80%;display:flex;flex-direction:column;gap:1.1cqw;align-items:center;box-shadow:0 .8cqw 0 var(--ink)}
.panel h2{font-family:var(--fd);font-weight:400;font-size:max(18px,4.4cqw);margin:0;line-height:1.1}
.panel ul{margin:0;padding:0;list-style:none;font-size:max(11px,1.9cqw);font-weight:800;text-align:left;display:flex;flex-direction:column;gap:.5cqw}
.panel li::before{content:"♪ ";color:var(--tomato)}
.keys{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center;font-size:max(10px,1.6cqw);font-weight:800}
kbd{font-family:var(--fd);background:var(--ink);color:var(--paper);border-radius:.6cqw;padding:.1cqw .8cqw}
.rank.stamp{animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{from{transform:rotate(-24deg) scale(3);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.rank{font-family:var(--fd);font-size:max(22px,6cqw);line-height:1;padding:1cqw 3cqw;border:.5cqw solid currentColor;border-radius:1.5cqw;transform:rotate(-6deg);background:var(--paper)}
.comment{font-size:max(12px,2.3cqw);font-weight:800;line-height:1.5;max-width:62cqw;text-wrap:balance}
.stats{display:flex;gap:1.4cqw;font-size:max(10px,1.6cqw);font-weight:800;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:center}
.stats span{background:var(--ink);color:var(--paper);padding:.4cqw 1.2cqw;border-radius:99px}
.calnum{font-family:var(--fd);font-size:max(20px,5cqw);font-variant-numeric:tabular-nums}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pads button{font-size:20px;padding:18px 0;border-width:4px;box-shadow:0 6px 0 #120b07;touch-action:manipulation}
.pads #padB{background:var(--sky)}
.help{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;margin:0}
.help kbd{font-size:12px;padding:1px 6px;border-radius:4px}
@media (max-width:700px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .card small{display:none}
}
@media (prefers-reduced-motion:reduce){button{transition:none}.rank.stamp{animation:none}}
</style>

</head>
<body>
<main class="wrap">
  <div class="screen" id="screen">
    <canvas id="cv" width="960" height="540"></canvas>

    <section id="ovTitle" class="ov">
      <h1>リズム珍道場</h1>
      <div class="sub">ちょっとヘンな 20のリズム修行</div>
      <div class="row">
        <button id="btnPlay">あそぶ</button>
        <button id="btnCal" class="ghost">タイミング調整</button>
      </div>
    </section>

    <section id="ovSelect" class="ov dim" hidden>
      <div class="grid" id="grid"></div>
      <div class="row"><button id="btnBack" class="ghost">タイトルへ</button></div>
    </section>

    <section id="ovHow" class="ov dim" hidden>
      <div class="panel">
        <h2 id="howName"></h2>
        <ul id="howList"></ul>
        <div class="keys" id="howKeys"></div>
        <div class="row">
          <button id="btnStart">はじめる</button>
          <button id="btnHowBack" class="ghost">もどる</button>
        </div>
      </div>
    </section>

    <section id="ovResult" class="ov dim" hidden>
      <div class="panel">
        <h2 id="resName"></h2>
        <div class="rank" id="resRank"></div>
        <div class="comment" id="resComment"></div>
        <div class="stats" id="resStats"></div>
        <div class="row">
          <button id="btnRetry">もういちど</button>
          <button id="btnNext">つぎのステージ</button>
          <button id="btnResBack" class="ghost">ステージ選択</button>
        </div>
      </div>
    </section>

    <section id="ovCal" class="ov dim" hidden>
      <div class="panel">
        <h2>タイミング調整</h2>
        <ul><li>「カッ」の音に合わせて <kbd>Space</kbd> か「タップ」を押す</li><li>8回たたくと自動で調整します</li></ul>
        <div class="calnum" id="calNum">0 ms</div>
        <div class="row">
          <button id="calMinus" class="ghost">−10</button>
          <button id="calTap">タップ</button>
          <button id="calPlus" class="ghost">＋10</button>
        </div>
        <div class="row"><button id="calDone" class="ghost">おわり</button></div>
      </div>
    </section>
  </div>

  <div class="pads" id="pads" hidden>
    <button id="padA">A</button>
    <button id="padB">B</button>
  </div>
  <p class="help">A：<kbd>Space</kbd> <kbd>J</kbd> <kbd>Z</kbd> または画面タップ（長押しあり） ／ B：<kbd>F</kbd> <kbd>X</kbd> または画面の右半分 ／ <kbd>Esc</kbd> でやめる</p>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d'); const W=960,H=540, TAU=Math.PI*2;
const INK='#2b1d14', FD="'Dela Gothic One','Hiragino Sans',sans-serif", FB="'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif";
const SKIN='#ffd9b0', SKIN_D='#efb98a';
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), frac=x=>x-Math.floor(x);
const ease=t=>1-Math.pow(1-clamp(t),3);
let NOW=0;

/* ================= オーディオ ================= */
let AC=null, musicBus, sfxBus, noiseBuf, revIn, dlyIn, dlyNode;
function audio(){
  if(AC){ if(AC.state!=='running') AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor(); comp.connect(AC.destination);
  musicBus=AC.createGain(); musicBus.gain.value=.34; musicBus.connect(comp);
  sfxBus=AC.createGain(); sfxBus.gain.value=.95; sfxBus.connect(comp);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  // リバーブ（合成インパルス）
  const n=Math.floor(AC.sampleRate*2.2), ib=AC.createBuffer(2,n,AC.sampleRate);
  for(let c=0;c<2;c++){const dd=ib.getChannelData(c);for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2)}
  const rev=AC.createConvolver();rev.buffer=ib;const rg=AC.createGain();rg.gain.value=.55;rev.connect(rg).connect(comp);
  revIn=AC.createGain();revIn.connect(rev);
  const ss=AC.createGain();ss.gain.value=.12;sfxBus.connect(ss).connect(revIn);
  // 付点8分ディレイ
  dlyNode=AC.createDelay(2);dlyNode.delayTime.value=.3;const fb=AC.createGain();fb.gain.value=.3;const df=AC.createBiquadFilter();df.type='lowpass';df.frequency.value=2400;
  dlyIn=AC.createGain();dlyIn.connect(dlyNode);dlyNode.connect(df);df.connect(fb);fb.connect(dlyNode);const dout=AC.createGain();dout.gain.value=.5;df.connect(dout).connect(musicBus);
}
const lat=()=>AC?(AC.outputLatency||AC.baseLatency||0):0;
const mf=m=>440*Math.pow(2,(m-69)/12);
function route(node,bus,pan,rev,dly){
  let n=node;if(pan){const p=AC.createStereoPanner();p.pan.value=pan;n.connect(p);n=p}
  n.connect(bus);
  if(rev){const r=AC.createGain();r.gain.value=rev;n.connect(r).connect(revIn)}
  if(dly){const r=AC.createGain();r.gain.value=dly;n.connect(r).connect(dlyIn)}
}
function tone(t,f,dur,{type='square',vol=.3,to=null,att=.005,bus=sfxBus,vib=0,pan=0,rev=0}={}){
  const o=AC.createOscillator(), a=AC.createGain(); o.type=type;
  o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=6;lg.gain.value=vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+dur+.03)}
  a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(vol,t+att); a.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(a); route(a,bus,pan,rev); o.start(t); o.stop(t+dur+.03);
}
function hold(t,f,dur,{type='sine',vol=.12,to=null}={}){
  const o=AC.createOscillator(), a=AC.createGain(); o.type=type;
  o.frequency.setValueAtTime(f,t); if(to) o.frequency.linearRampToValueAtTime(to,t+dur);
  a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(vol,t+.02); a.gain.setValueAtTime(vol,t+Math.max(.03,dur-.03)); a.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(a).connect(sfxBus); o.start(t); o.stop(t+dur+.03);
}
function noise(t,dur,{vol=.3,type='highpass',f=1000,q=1,to=null,bus=sfxBus,pan=0,rev=0}={}){
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); if(to) fl.frequency.exponentialRampToValueAtTime(to,t+dur); fl.Q.value=q;
  const a=AC.createGain(); a.gain.setValueAtTime(vol,t); a.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl).connect(a); route(a,bus,pan,rev); s.start(t,Math.random()*.5); s.stop(t+dur+.03);
}
// 2オシレーター＋フィルターエンベロープのシンセ
function synth(t,f,dur,{type='sawtooth',vol=.1,cut=2000,env=2,q=1,det=8,att=.01,rel=.08,rev=0,dly=0,vib=0,pan=0}={}){
  const out=AC.createGain(), fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.Q.value=q;
  fl.frequency.setValueAtTime(Math.min(16000,cut*env),t); fl.frequency.exponentialRampToValueAtTime(cut,t+Math.max(.02,Math.min(dur,.25)));
  for(const dt of det?[-det,det]:[0]){
    const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=dt;
    if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.5;lg.gain.value=f*vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+dur+rel+.05)}
    o.connect(fl);o.start(t);o.stop(t+dur+rel+.05);
  }
  const v=vol/(det?1.6:1);
  out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(v,t+att);out.gain.setValueAtTime(v,t+Math.max(att,dur));out.gain.exponentialRampToValueAtTime(.0001,t+dur+rel);
  fl.connect(out);route(out,musicBus,pan,rev,dly);
}
const SFX={
  toss:(t,p=1)=>tone(t,480*p,.13,{type:'sine',to:900*p,vol:.55}),
  tossF:t=>{tone(t,820,.07,{type:'sine',to:1500,vol:.5});tone(t+.06,1300,.07,{type:'sine',to:1900,vol:.35})},
  slice:t=>{noise(t,.12,{f:3500,vol:.6});tone(t,2600,.16,{type:'triangle',to:3400,vol:.22})},
  sliceOk:t=>{noise(t,.1,{f:1400,vol:.5});tone(t,900,.1,{type:'triangle',vol:.2})},
  splat:t=>noise(t,.3,{type:'lowpass',f:900,to:150,vol:.8}),
  whiff:t=>noise(t,.07,{type:'bandpass',f:2200,vol:.25}),
  peko:(t,p=1)=>{tone(t,660*p,.07,{vol:.16});tone(t+.05,880*p,.09,{vol:.13})},
  dogeza:t=>{tone(t,320,.45,{type:'sawtooth',to:70,vol:.28});noise(t+.3,.3,{type:'lowpass',f:400,vol:.7})},
  coo:(t,p=1)=>{tone(t,430*p,.15,{type:'sine',to:250*p,vol:.6});tone(t,860*p,.06,{type:'sine',vol:.12})},
  flap:t=>{noise(t,.05,{type:'bandpass',f:1300,q:2,vol:.55});noise(t+.07,.06,{type:'bandpass',f:1000,q:2,vol:.5})},
  caw:t=>{tone(t,720,.24,{type:'sawtooth',to:480,vol:.22});noise(t,.2,{type:'bandpass',f:1500,q:4,vol:.2})},
  whistle:t=>{tone(t,2700,.13,{type:'sine',vol:.32});tone(t,2740,.13,{type:'sine',vol:.2})},
  don:(t,big)=>tone(t,big?65:115,.2,{type:'sine',to:40,vol:.85}),
  push:t=>{noise(t,.08,{type:'lowpass',f:1000,vol:.6});tone(t,220,.1,{to:120,vol:.18})},
  squeak:t=>tone(t,1250,.1,{to:1900,vol:.1}),
  miss:t=>tone(t,190,.22,{type:'sawtooth',to:90,vol:.22}),
  click:(t,hi)=>tone(t,hi?1500:1000,.05,{vol:.35}),
  crash:t=>noise(t,1.3,{f:5000,vol:.3,bus:musicBus}),
  cheer:t=>{for(let i=0;i<16;i++)noise(t+i*.035,.25,{type:'bandpass',f:1200+Math.random()*2500,q:3,vol:.16})},
  lift:t=>noise(t,.12,{type:'bandpass',f:600,to:2400,q:2,vol:.45}),
  chah:t=>{noise(t,.09,{type:'bandpass',f:2600,q:1.5,vol:.75});tone(t,180,.09,{type:'sine',to:90,vol:.5})},
  chahBad:t=>{noise(t,.18,{type:'lowpass',f:700,vol:.6});tone(t,140,.2,{type:'sawtooth',to:70,vol:.18})},
  ping:(t,p=1)=>tone(t,1000*p,.06,{type:'sine',vol:.6}),
  lob:t=>tone(t,1300,.18,{type:'sine',to:1700,vol:.5}),
  smash:t=>{noise(t,.1,{f:1500,vol:.7});tone(t,620,.1,{to:300,vol:.3})},
  bounce:t=>tone(t,1900,.035,{type:'sine',vol:.4}),
  syl:(t,m)=>tone(t,mf(m),.2,{type:'square',vol:.17,vib:6}),
  okChime:t=>{tone(t,1046,.14,{type:'sine',vol:.4});tone(t+.1,1318,.2,{type:'sine',vol:.4})},
  ngBuzz:t=>{tone(t,140,.28,{type:'sawtooth',vol:.25});tone(t,147,.28,{type:'square',vol:.12})},
  stampA:t=>{tone(t,160,.12,{type:'sine',to:60,vol:.8});noise(t,.05,{f:2500,vol:.3})},
  stampB:t=>{tone(t,110,.15,{type:'sine',to:45,vol:.9});noise(t,.12,{type:'bandpass',f:900,vol:.45})},
};
const DR={
  k:t=>{tone(t,160,.28,{type:'sine',to:40,vol:.95,bus:musicBus});noise(t,.015,{f:3000,vol:.22,bus:musicBus})},
  s:t=>{noise(t,.18,{type:'bandpass',f:1900,q:.7,vol:.55,bus:musicBus,rev:.25});tone(t,210,.09,{type:'triangle',to:160,vol:.3,bus:musicBus})},
  cl:t=>{for(const d of[0,.012,.025])noise(t+d,.06,{type:'bandpass',f:1300,q:1.2,vol:.4,bus:musicBus,rev:.3})},
  h:t=>noise(t,.035,{f:8000,vol:.2,bus:musicBus,pan:.25}),
  oh:t=>noise(t,.22,{f:7000,vol:.15,bus:musicBus,pan:.25}),
  sh:t=>noise(t,.05,{type:'bandpass',f:6000,q:2,vol:.12,bus:musicBus,pan:-.3}),
  r:t=>tone(t,1700,.03,{type:'square',vol:.1,bus:musicBus,pan:-.2}),
  tom:(t,p)=>tone(t,200*p,.22,{type:'sine',to:110*p,vol:.6,bus:musicBus,rev:.2}),
  taiko:t=>{tone(t,95,.45,{type:'sine',to:52,vol:1,bus:musicBus,rev:.35});noise(t,.08,{type:'lowpass',f:400,vol:.5,bus:musicBus})},
  kane:t=>{tone(t,2300,.07,{type:'square',vol:.06,bus:musicBus,pan:.4});tone(t,3450,.05,{type:'sine',vol:.05,bus:musicBus,pan:.4})},
  crash:t=>noise(t,1.4,{f:4500,vol:.25,bus:musicBus,rev:.4}),
};
Object.assign(SFX,{
  hai:t=>{tone(t,620,.08,{to:820,vol:.2});tone(t+.04,980,.06,{type:'sine',vol:.15})},
  otto:t=>tone(t,520,.3,{type:'triangle',to:330,vol:.4,vib:14}),
  yoi:(t,p)=>tone(t,500*p,.09,{to:640*p,vol:.18}),
  pound:t=>{tone(t,130,.22,{type:'sine',to:48,vol:.95});noise(t,.12,{type:'lowpass',f:500,vol:.55});tone(t+.03,320,.12,{type:'triangle',to:170,vol:.25})},
  count:(t,n)=>tone(t,[0,698,784,880][n]||600,.2,{vol:.18,vib:5,rev:.2}),
  pull:t=>{tone(t,300,.12,{type:'sine',to:1500,vol:.5});tone(t+.08,1700,.06,{type:'sine',vol:.3,rev:.3})},
  chomp:t=>{noise(t,.15,{type:'lowpass',f:600,vol:.8});tone(t,95,.2,{to:60,vol:.25})},
  shuu:(t,pan)=>noise(t,.2,{type:'bandpass',f:2200,to:6500,q:3,vol:.75,pan}),
  clang:(t,pan)=>{tone(t,2400,.25,{type:'triangle',vol:.3,pan,rev:.3});tone(t,3170,.18,{type:'sine',vol:.2,pan});noise(t,.05,{f:5000,vol:.4,pan})},
  stab:t=>{noise(t,.08,{type:'lowpass',f:900,vol:.6});tone(t,180,.1,{to:90,vol:.2})},

  ojigi(c,b,offs,line,{pres=false,deep=false}={}){
    c.ev.push({mod:'ojigi',type:'say',who:'boss',beat:b-.5,dur:4,text:line});
    for(const o of offs){c.cues.push({beat:b+o,fn:deep?SFX.dogeza:t=>SFX.peko(t,pres?.8:1)});

    c.ev.push({mod:'hato',type:'lead',beat:b+o,btn});c.ev.push({mod:'hato',type:'mine',beat:b+o+1,hit:true,btn});}},
  crow(c,b){c.cues.push({beat:b,fn:SFX.caw});c.ev.push({mod:'hato',type:'crow',beat:b})},
  pax(c,b,kind){
    const big=kind==='sumo'||kind==='giraffe';c.cues.push({beat:b,fn:t=>SFX.don(t,big)});
    const p={mod:'train',type:'pax',beat:b,kind,notes:[],inAt:null};
    const offs=kind==='sumo'?[.5,1.5,2.5]:[.5];
    offs.forEach((o,i)=>{const n={mod:'train',type:'push',beat:b+o,hit:true,btn:'A',pax:p,last:i===offs.length-1};p.notes.push(n);c.ev.push(n)});
    c.ev.push(p);

  whistle(c,b){c.cues.push({beat:b,fn:SFX.whistle});c.ev.push({mod:'train',type:'whistle',beat:b})},
  say(c,mod,who,b,dur,text){c.ev.push({mod,type:'say',who,beat:b,dur,text})},
  // 店長が [開始, 長さ] で湯切り → 4拍あとに同じリズムで長押し
  ramen(c,b,holds,line){
    if(line)c.ev.push({mod:'ramen',type:'say',who:'cust',beat:b-1,dur:3,text:line});
    for(const [o,len] of holds){
      c.cues.push({beat:b+o,fn:SFX.lift});c.cues.push({beat:b+o,fn:t=>hold(t,700,len*c.spb,{type:'triangle',vol:.1,to:1100})});

      const p={mod:'ramen',type:'press',beat:b+4+o,hit:true,btn:'A'};
      const r={mod:'ramen',type:'release',beat:b+4+o+len,hit:true,btn:'R',pair:p};p.pair=r;
      c.ev.push(p,r);

  },
  pong(c,b,seq){
    for(const k of seq){
      if(k==='-'){b+=2;continue}
      const dur={n:1,l:2,s:.5,z:.5}[k];
      c.cues.push({beat:b,fn:k==='l'?SFX.lob:k==='s'||k==='z'?SFX.smash:t=>SFX.ping(t,1)});
      if(k==='n'||k==='l')c.cues.push({beat:b+dur/2,fn:SFX.bounce});

      c.ev.push({mod:'pong',type:'shot',beat:b,kind:k,dur,note:n},n);

    return b;

  },

}
function buildMusic(scenes,bars4,spb,start,q,silent=[]){
  const step=spb/4, nb=bars4/4, add=(t,f)=>{const b=(t-start)/spb;if(!silent.some(([a,z])=>b>=a-.02&&b<z-.02))q.push({t,f})};
  const modAt=b=>{let m=scenes[0].mod;for(const s of scenes)if(b>=s.from)m=s.mod;return m};
  for(let bar=0;bar<nb;bar++){
    const B0=bar*4, st=MODS[modAt(B0)].music, chord=st.prog[bar%st.prog.length];
    const minor=st.scale.includes(3)&&!st.scale.includes(4), tri=[0,minor?3:4,7,12,minor?15:16];
    const intro=bar===0, last=bar===nb-1, hot=!intro&&Math.floor((bar-1)/4)%2===1, fill=!intro&&!last&&bar%4===0;
    const lead=st.lead[(bar-1+st.lead.length*8)%st.lead.length], sw=st.swing||0, arp=st.arp||'0.1.2.1.0.1.2.3.';
    const T=i=>start+B0*spb+i*step+(i%4===2?sw*step:0);
    if(last){add(T(0),DR.k);add(T(0),DR.crash);for(const iv of tri.slice(0,3)){const m=st.root+chord+iv;add(T(0),tt=>synth(tt,mf(m),spb*2,{vol:.06,cut:2200,rev:.6}))}continue}
    if(!intro&&(bar-1)%4===0)add(T(0),DR.crash);
    // パッド（小節頭に和音を伸ばす）
    for(const iv of tri.slice(0,3)){const m=st.root+chord+iv;add(T(0),tt=>synth(tt,mf(m),spb*3.7,{vol:hot?.034:.024,cut:hot?1500:900,env:1.4,att:.25,rel:.5,rev:.7,det:14}))}
    for(let i=0;i<16;i++){
      const t=T(i);
      if(fill&&i>=12){ if(i===12)add(t,DR.k); add(t,i<15?(tt=>DR.tom(tt,1.5-(i-12)*.2)):DR.s); }
      else{
        if(st.k[i]==='x')add(t,DR.k);
        const sc=st.s[i]; if(!intro){if(sc==='x')add(t,DR.s);else if(sc==='c')add(t,DR.cl)}
        const hc=st.h[i]; if(hc==='x')add(t,(hot&&i%4===2)?DR.oh:DR.h);else if(hc==='r')add(t,DR.r);else if(hc==='k')add(t,DR.kane);
        if(hot&&i%2===1&&!st.tk)add(t,DR.sh);
        if(st.tk&&st.tk[i]==='x')add(t,DR.taiko);
      }
      const bm={'1':0,'3':tri[1],'5':7,'8':12}[st.bass[i]];
      if(bm!=null){const m=st.root-24+chord+bm;
        add(t,tt=>{synth(tt,mf(m),step*1.5,{type:'sawtooth',vol:.12,cut:420,env:3.5,q:5,det:0,rel:.06});tone(tt,mf(m),step*1.6,{type:'sine',vol:.26,bus:musicBus})})}
      if(hot&&arp[i]>='0'&&arp[i]<='4'){const m=st.root+12+chord+tri[+arp[i]];const pn=i%4<2?-.35:.35;add(t,tt=>synth(tt,mf(m),step*.6,{type:'square',vol:.03,cut:3200,env:2,att:.003,rel:.12,det:0,dly:.45,pan:pn}))}
      const lc=lead[i];
      if(!intro&&lc>='1'&&lc<='9'){
        let n=1;while(lead[i+n]==='-')n++;
        const d=+lc-1, sc=st.scale, m=st.root+12+sc[d%sc.length]+12*Math.floor(d/sc.length), dur=step*n*.92, kind=st.kind||'lead';
        add(t,tt=>{
          if(kind==='pluck')synth(tt,mf(m),Math.min(dur,step*1.2),{type:'sawtooth',vol:.09,cut:1500,env:5,att:.003,rel:.4,det:5,rev:.35,dly:.25});
          else if(kind==='flute')synth(tt,mf(m),dur,{type:'sine',vol:.14,cut:5000,env:1,att:.04,rel:.12,det:0,vib:.012,rev:.45,dly:.3});
          else synth(tt,mf(m),dur,{type:st.wave,vol:(st.wave==='sine'||st.wave==='triangle')?.14:.07,cut:2600,env:1.8,att:.01,rel:.1,det:7,vib:.005,rev:.3,dly:.3});
          if(hot)synth(tt,mf(m+12),dur,{type:'triangle',vol:.035,cut:5000,env:1,det:0,rev:.5});
        });
      }
    }
  }
}
function curBeat(){return (AC.currentTime-lat()-S.start)/S.spb}
function modAtBeat(B){let m=S.scenes[0].mod;for(const s of S.scenes)if(B>=s.from)m=s.mod;return m}
function evTime(ev){const age=ev&&ev.timeStamp?Math.max(0,Math.min(.2,(performance.now()-ev.timeStamp)/1000)):0;return AC.currentTime-age-lat()-offsetMs/1000}

function press(btn,ev){
  if(mode==='cal'){calTap(ev);return}
  if(mode!=='play'||!S)return;
  if(btn==='B'&&!S.st.btnB)return;
  const t=evTime(ev), B=(t-S.start)/S.spb, mod=modAtBeat(B);
  if(btn==='A')S.hold=true;
  let bn=null,bd=1;
  for(const n of S.notes){if(n.res||n.btn!==btn)continue;const d=t-n.time;if(Math.abs(d)<bd){bd=Math.abs(d);bn=n}if(n.time>t+.3)break}
  S.lp[btn]=B;
  if(bn&&bd<=.11){
    const d=t-bn.time;bn.res=Math.abs(d)<=.05?'p':'o';bn.d=d;bn.hb=B;
    MODS[bn.mod].hit(bn,AC.currentTime,bn.res==='p');fxHit(bn,bn.res==='p');
    S.lastJ={mod:bn.mod,beat:B,res:bn.res};
    if(bn.pax&&bn.last&&bn.pax.notes.every(n=>n.res==='p'||n.res==='o'))bn.pax.inAt=B;
  }else{
    const fz=S.byMod.daruma&&S.byMod.daruma.find(e=>e.type==='freeze'&&B>=e.from&&B<e.to);
    if(fz){S.caught++;S.caughtAt=B;fxMiss();SFX.ngBuzz(AC.currentTime);S.lastJ={mod:'daruma',beat:B,res:'m'};return}
    S.strays++;S.strayAt=B;if(S.byMod.kushami&&S.byMod.kushami.some(e=>e.type==='sneeze'&&e.fake&&B>e.end-.2&&B<e.end+.9))S.fakeStray=(S.fakeStray||0)+1;MODS[mod].whiff(btn,AC.currentTime);
    if(S.byMod.hato&&S.byMod.hato.some(e=>e.type==='crow'&&B-e.beat>-.2&&B-e.beat<1.3))S.crowStray++;
  }
}
function release(ev){
  if(mode!=='play'||!S||!S.hold)return;
  S.hold=false;
  const t=evTime(ev), B=(t-S.start)/S.spb; S.lr=B;
  // 押している長押しノーツの「離し」を判定（早すぎる離しはミス）
  const r=S.notes.find(n=>n.btn==='R'&&!n.res&&n.pair&&(n.pair.res==='p'||n.pair.res==='o'));
  if(!r)return;
  const d=t-r.time;
  if(Math.abs(d)<=.11){r.res=Math.abs(d)<=.05?'p':'o';r.d=d;r.hb=B;MODS[r.mod].hit(r,AC.currentTime,r.res==='p');fxHit(r,r.res==='p');S.lastJ={mod:r.mod,beat:B,res:r.res}}
  else if(d<-.11){r.res='m';r.hb=B;MODS[r.mod].miss(AC.currentTime);fxMiss();S.lastJ={mod:r.mod,beat:B,res:'m'}}
}
function checkMiss(){
  const t=AC.currentTime-lat()-offsetMs/1000;
  for(const n of S.notes){if(n.time>t)break;if(!n.res&&t-n.time>.11){
    n.res='m';n.hb=n.beat;
    if(n.pair&&n.btn==='A'&&!n.pair.res){n.pair.res='m';n.pair.hb=n.pair.beat}
    MODS[n.mod].miss(AC.currentTime);fxMiss();S.lastJ={mod:n.mod,beat:n.beat,res:'m'}}}
}
function finish(){
  mode='result';$('pads').hidden=true;
  const ns=S.notes, p=ns.filter(n=>n.res==='p').length,o=ns.filter(n=>n.res==='o').length,m=ns.filter(n=>n.res==='m').length;
  const raw=(p+o*.6)/ns.length*100, sc=Math.max(0,Math.round(raw-S.strays*.8-S.caught*6));
  const r=rankOf(sc);
  const hits=ns.filter(n=>n.d!=null), avg=hits.length?hits.reduce((a,n)=>a+n.d,0)/hits.length:0;
  let cm=S.st.cm[r.k];
  if(p===ns.length&&S.strays===0&&S.caught===0)cm='全部ジャスト！ '+cm;
  else if(S.caught>0)cm+=` ${S.caught}回うごいてバレた。`;
  else if(S.crowStray>0)cm+=' あと、カラスにつられてたよ。';
  else if(S.fakeStray>0)cm+=' 「でない」につられてたよ。';
  else if(ns.some(n=>n.mod==='hanko'&&n.btn==='B'&&n.res==='m'))cm+=' あやしい書類が通っちゃった。';
  else if(avg>.025)cm+=' ちょっと遅れぎみ。';
  else if(avg<-.025)cm+=' ちょっと前のめり。';
  $('resName').textContent=S.st.name;$('resRank').textContent=r.t;const rk=$('resRank');rk.classList.remove('stamp');void rk.offsetWidth;rk.classList.add('stamp');FX.combo=0;FX.banner=null;FX.resultHi=r.k==='hi';$('resRank').style.color=r.c;$('resComment').textContent=cm;
  $('resStats').innerHTML=`<span>スコア ${sc}</span><span>ジャスト ${p}</span><span>おしい ${o}</span><span>ミス ${m}</span><span>空振り ${S.strays+S.caught}</span>`;
  if(best[S.st.id]==null||sc>best[S.st.id]){best[S.st.id]=sc;store.set('chin-best',best)}
  if(r.k==='hi')SFX.cheer(AC.currentTime);
  const idx=STAGES.indexOf(S.st);$('btnNext').hidden=idx>=STAGES.length-1;
  show('ovResult');$('btnRetry').focus();
}
function quit(){mode='select';S=null;$('pads').hidden=true;renderSelect();show('ovSelect');}

/* ================= キャリブレーション ================= */
let cal=null;
function calStart(){audio();mode='cal';cal={start:AC.currentTime+.4,spb:.6,taps:[],next:0};$('calNum').textContent=offsetMs+' ms';show('ovCal');}
function calTap(ev){
  if(!cal)return;const age=ev&&ev.timeStamp?Math.max(0,(performance.now()-ev.timeStamp)/1000):0;
  const t=AC.currentTime-age-lat(), k=Math.round((t-cal.start)/cal.spb), d=t-(cal.start+k*cal.spb);
  if(k<1)return;cal.taps.push(d);
  if(cal.taps.length>=8){const s=[...cal.taps].sort((a,b)=>a-b);offsetMs=Math.round((s[3]+s[4])/2*1000);store.set('chin-offset',offsetMs);cal.taps=[];$('calNum').textContent=offsetMs+' ms（設定しました）'}
  else $('calNum').textContent=`${cal.taps.length} / 8`;
}
$('calMinus').onclick=()=>{offsetMs-=10;store.set('chin-offset',offsetMs);$('calNum').textContent=offsetMs+' ms'};
$('calPlus').onclick=()=>{offsetMs+=10;store.set('chin-offset',offsetMs);$('calNum').textContent=offsetMs+' ms'};
$('calTap').addEventListener('pointerdown',e=>{e.preventDefault();calTap(e)});
$('calDone').onclick=()=>{mode='title';cal=null;show('ovTitle')};

/* ================= 入力 ================= */
const KA=new Set(['Space','KeyJ','KeyZ','ArrowDown']),KB=new Set(['KeyF','KeyX','ArrowUp']);
addEventListener('keydown',e=>{
  if(mode==='play'){
    if(e.code==='Escape'){quit();return}
    if(e.repeat){if(KA.has(e.code)||KB.has(e.code))e.preventDefault();return}
    if(KA.has(e.code)){e.preventDefault();press('A',e)}else if(KB.has(e.code)){e.preventDefault();press('B',e)}
  }else if(mode==='cal'&&KA.has(e.code)&&!e.repeat){e.preventDefault();calTap(e)}
});
addEventListener('keyup',e=>{if(mode==='play'&&KA.has(e.code))release(e)});
let ptrA=null;
$('screen').addEventListener('pointerdown',e=>{
  if(mode!=='play')return;e.preventDefault();
  const r=$('screen').getBoundingClientRect();const b=S.st.btnB&&(e.clientX-r.left)>r.width/2?'B':'A';
  if(b==='A')ptrA=e.pointerId;press(b,e);
});
for(const ty of['pointerup','pointercancel'])addEventListener(ty,e=>{if(e.pointerId===ptrA){ptrA=null;release(e)}});
$('padA').addEventListener('pointerdown',e=>{e.preventDefault();ptrA=e.pointerId;press('A',e)});
$('padB').addEventListener('pointerdown',e=>{e.preventDefault();press('B',e)});

$('btnPlay').onclick=()=>{audio();mode='select';renderSelect();show('ovSelect');$('grid').querySelector('button')?.focus()};
$('btnCal').onclick=calStart;
$('btnBack').onclick=()=>{mode='title';show('ovTitle')};
$('btnStart').onclick=()=>startStage(cur);
$('btnHowBack').onclick=()=>{show('ovSelect')};
$('btnRetry').onclick=()=>startStage(S.st);
$('btnNext').onclick=()=>{const i=STAGES.indexOf(S.st);if(i<STAGES.length-1)openHow(STAGES[i+1])};
$('btnResBack').onclick=quit;

/* ================= メインループ ================= */
let t0=performance.now(),lastNow=0;
function loop(now){
  NOW=(now-t0)/1000;const dt=Math.min(.05,Math.max(0,NOW-lastNow));lastNow=NOW;
  if(mode==='play'&&S){
    const ahead=AC.currentTime+.15;
    while(S.qi<S.q.length&&S.q[S.qi].t<ahead){const it=S.q[S.qi++];if(it.t>AC.currentTime-.02)it.f(Math.max(it.t,AC.currentTime))}
    checkMiss();
    const B=curBeat(), mod=modAtBeat(B);
    const sh=FX.shake;g.save();if(sh>0){g.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);FX.shake=Math.max(0,sh-dt*40)}
    MODS[mod].draw(B,S.byMod[mod]||[],S);
    g.restore();
    drawFX(dt,B);
    drawIntro(B,S.st.name);
    for(const sc of S.scenes){const d=B-sc.from;if(sc.from>0&&d>-.6&&d<.5){const k=d<0?ease((d+.6)/.6):1-ease(d/.5);drawWipe(k,(STAGES.find(s=>s.id===sc.mod)||{}).name||'')}}
    if(B<0){g.fillStyle='rgba(0,0,0,'+clamp(-B/2)+')';g.fillRect(0,0,W,H)}
    if(B>S.len-1.5){g.fillStyle='rgba(43,29,20,'+clamp((B-S.len+1.5)/1.5)+')';g.fillRect(0,0,W,H)}
    if(B>S.len) finish();
  }else{
    if(mode==='cal'&&cal){while(cal.start+cal.next*cal.spb<AC.currentTime+.15){SFX.click(cal.start+cal.next*cal.spb,cal.next%4===0);cal.next++}}
    const c=mode==='result'?['#ffcf3f','#ffdd6b']:['#ef5a3c','#f26d4f'];
    sunburst(480,300,c[0],c[1],NOW*.15,18);
    const bt=NOW*1.9, bb=Math.abs(Math.sin(bt*Math.PI));
    MODS.tofu.thing('giant',150,430-bb*40,Math.sin(NOW*2)*.15,0,1.4);
    MODS.hato.pigeon(820,470,-1,Math.max(0,Math.sin(bt*Math.PI)),0,{tie:true});
    if(mode==='result'&&FX.resultHi&&Math.random()<.6)FX.parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*60,vy:60+Math.random()*80,life:0,max:4,c:CONF[Math.floor(Math.random()*5)],r:4+Math.random()*4,k:'conf',rot:Math.random()*6,vr:(Math.random()-.5)*10});
    drawParts(dt);
  }
  requestAnimationFrame(loop);
}
document.fonts?.load?.(`40px 'Dela Gothic One'`).catch(()=>{});
requestAnimationFrame(loop);
</script>
